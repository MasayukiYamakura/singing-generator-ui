name: Mobile workflow layout
on:
  pull_request:
    paths:
      - 'index.html'
      - 'style.css'
      - 'studio.js'
      - 'workflow.js'
      - 'app-v0.5.3.js'
      - 'tests/workflow-mobile.mjs'
      - '.github/workflows/workflow-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: node tests/workflow-mobile.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-workflow-screenshot
          path: mobile-workflow.png
          if-no-files-found: ignore
          retention-days: 7
