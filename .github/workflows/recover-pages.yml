name: Recover stalled Pages deployment
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-pages.yml]
  workflow_dispatch:
permissions:
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel only the known stalled deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALLED_DEPLOYMENT: 9eda61b66c1cd30d17a4a13a3fe324aa17f39417
        run: |
          gh api "repos/$GH_REPO/pages/deployments/$STALLED_DEPLOYMENT" --jq '.status'
          gh api --method POST "repos/$GH_REPO/pages/deployments/$STALLED_DEPLOYMENT/cancel"
